[project]
name = "syrion-gateway"
version = "0.1.0-phase0"
description = "SYRION Gateway — Phase 0 Stub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pyyaml==6.0.2",
  "python-dotenv==1.0.1",
  "httpx==0.27.2",
  "anyio==4.10.0",
  "psutil==6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-asyncio==0.23.7",
  "httpx==0.27.2",
  "ruff==0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
